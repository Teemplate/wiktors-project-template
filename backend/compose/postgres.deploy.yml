# Block: postgres — production and staging. Data bind-mounts from
# /mnt/ssd/apps/<stack>/, never baked into an image, so a code-only redeploy
# never touches data — and staging's STACK keeps its directory SEPARATE from
# production's, which is the mistake staging exists to prevent.
services:
  db:
    image: postgres:16-alpine
    container_name: ${STACK:-${APP_NAME}}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /mnt/ssd/apps/${STACK:-${APP_NAME}}/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot: applies migrations and EXITS. The app services wait for it to
  # complete successfully, so a bad revision aborts the deploy with the old
  # containers still serving, instead of leaving a half-migrated database
  # behind a running app. Same image as the backend -- no second build.
  migrate:
    build:
      context: ./backend
    image: ${STACK:-${APP_NAME}}-backend
    container_name: ${STACK:-${APP_NAME}}-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

networks:
  internal:
