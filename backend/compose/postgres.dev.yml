# Block: postgres — local development: the database, plus `migrate`, a one-shot
# that applies migrations and exits. Every Python service that uses the
# database waits for it (the *.with-postgres.yml glue), so the schema is current
# on every `docker compose up`. After adding a revision while the stack is up:
#     docker compose up migrate
# Seed it with: docker compose run --rm migrate python -m app.seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Overridable: a fixed host port is a booby trap on a machine that already
      # runs other projects. In-container traffic always uses `db:5432`.
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # "started" is not enough — Postgres accepts connections seconds after the
      # process exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      # Mounted, so a new revision applies without rebuilding the image.
      - ./backend/app:/app/app:z
      - ./backend/migrations:/app/migrations:z
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
