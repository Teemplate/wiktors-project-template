[pytest]
testpaths = tests
# Put the backend directory on sys.path so `from app.main import app` resolves.
# WITHOUT this, bare `pytest` fails with ModuleNotFoundError: No module named
# 'app' while `python -m pytest` succeeds -- the latter adds the cwd to sys.path
# and the former does not. CI runs bare `pytest`, so the two disagreed and CI
# was red while every local run was green.
pythonpath = .
asyncio_mode = auto
# Pin the fixture loop scope explicitly — pytest-asyncio warns (and will change
# the default) if it is unset.
asyncio_default_fixture_loop_scope = function
addopts = -q -p no:warnings
