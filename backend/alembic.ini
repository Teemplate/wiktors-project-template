# Alembic configuration.
#
# sqlalchemy.url is deliberately EMPTY: migrations/env.py reads DATABASE_URL
# from the environment instead. Putting a URL here means a credential in the
# repo, and means CI and the Pi silently migrate whatever this file points at.
[alembic]
script_location = migrations
prepend_sys_path = .
# Revision filenames sort chronologically, which makes `ls versions/` readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
