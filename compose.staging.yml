# OPTIONAL — a staging environment on the same Pi.
#
# Staging earns its keep only for a specific reason -- for example, a seed that
# could overwrite production data in object storage. Adopt this when a bad
# deploy would be destructive or hard to notice, not by default
# -- a second stack costs memory, disk and build time on a 4-core Pi.
#
# Deployed by the same agent: `app-deploy staging` tracks origin/develop and
# does NOT require a signed tag, so every merge to develop lands here
# automatically while production still waits for a signed release tag.
#
# Everything is namespaced <app>-staging so nothing can collide with, or write
# into, production: separate compose project, separate container names,
# separate data directory, separate database.
#
#   docker compose -f compose.staging.yml -p <app>-staging up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: ${APP_NAME}-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # SEPARATE from production's directory. Pointing both at one path is the
      # mistake staging exists to prevent.
      - /mnt/ssd/apps/${APP_NAME}-staging/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: ./backend
    image: ${APP_NAME}-staging-backend
    container_name: ${APP_NAME}-staging-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    build:
      context: ./backend
    image: ${APP_NAME}-staging-backend
    container_name: ${APP_NAME}-staging-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        - VITE_API_BASE=${VITE_API_BASE}
    image: ${APP_NAME}-staging-frontend
    container_name: ${APP_NAME}-staging-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=${APP_NAME}-staging-backend
    depends_on:
      backend:
        condition: service_healthy
    networks: [web, internal]

networks:
  web:
    external: true
  internal:
