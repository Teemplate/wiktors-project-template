# LOCAL DEVELOPMENT ONLY. Production is compose.deploy.yml.
#
# Unlike production, this file DOES publish ports (there is no shared Caddy on a
# laptop) and mounts source for hot reload.
#
#   docker compose up --build
#   frontend  http://localhost:5173
#   backend   http://localhost:8000/api/health

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Overridable, because a FIXED host port is a booby trap on a machine that
      # already runs other projects. Set
      # DEV_DB_PORT in .env if 5432 is taken. In-container traffic is unaffected:
      # the app always reaches this service as `db:5432`.
      - "${DEV_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Depending on the container being "started" is not enough — Postgres
      # accepts connections seconds after the process exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      # See DEV_DB_PORT above. 8000 in particular is often already taken by
      # another local dev server.
      - "${DEV_API_PORT:-8000}:8000"
    volumes:
      # `:z` relabels the mount so SELinux (Fedora, RHEL) lets the container
      # read/write it. Harmless on non-SELinux hosts.
      #
      # Hot reload: source is mounted, so edits take effect without a rebuild.
      - ./backend/app:/app/app:z
      # Migrations are mounted too, so a new revision applies on the next
      # restart without rebuilding the image.
      - ./backend/migrations:/app/migrations:z
    # THE SCHEMA MIGRATES ITSELF ON EVERY START. Without this you eventually hit
    # the "works on my machine because I ran the migration weeks ago" failure,
    # and a teammate's fresh clone starts against an empty database.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    ports:
      - "${DEV_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:z
      # Anonymous volume keeps the container's own node_modules — without it the
      # host mount would shadow the install done in the image.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
