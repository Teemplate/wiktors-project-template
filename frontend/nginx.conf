server {
  listen 5173;
  root /usr/share/nginx/html;

  # The API, same-origin. WITHOUT this block /api/* falls through to the SPA
  # fallback below and returns index.html with a 200 -- the frontend then fails
  # with an opaque JSON parse error and the backend looks "unreachable" while
  # being perfectly healthy. The shared Caddy proxies this whole vhost to one
  # upstream (this container), so the split has to happen here.
  #
  # BACKEND_HOST is substituted at container start (see the entrypoint in the
  # Dockerfile's prod stage) so that the compose project name, and therefore the
  # backend's container name, is not baked into the image.
  location /api/ {
    proxy_pass http://${BACKEND_HOST}:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long enough for a slow first query on a cold arm64 container.
    proxy_read_timeout 60s;
  }

  # Hashed build assets: if one is missing it must 404, NOT fall through to
  # index.html. The fallback below would otherwise serve HTML for a missing
  # .js file, and the browser reports it as an opaque MIME-type error instead
  # of the 404 it actually is.
  location /assets/ {
    try_files $uri =404;
    # Filenames are content-hashed by Vite, so they can be cached forever.
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html itself must never be cached, or clients keep loading the old
  # bundle after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: unknown paths are client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
