name: E2E

# Deliberately NOT a required check on every pull request.
#
# The specs themselves are quick, but standing the stack up first -- building
# both images, migrating and seeding a database -- costs minutes. Paying that on
# every PR to re-prove that the list still renders would make the fast checks
# feel slow, and a gate people learn to wait out is a gate they learn to ignore.
#
# So: weekly against develop, on demand, and on any PR carrying the `run-e2e`
# label -- which is the one to reach for when touching the API surface, the
# nginx config, a migration, or the seed.
#
# It holds NO secrets. scripts/e2e.sh generates its own throwaway .env.e2e, and
# any spec that needs a real credential must skip without one rather than fail.

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly (Monday): nightly cost ~30 runs of Actions minutes a month
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e · full stack
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        # Only a project with the web block has browser tests (or a lockfile).
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run the suite
        run: ./scripts/e2e.sh

      # The trace is the only way to work out why a browser test failed on a
      # machine nobody can look at.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: |
          # scripts/e2e.sh derives the compose project from the directory name,
          # so do the same here rather than hardcoding it -- otherwise this step
          # silently logs nothing the moment the project is renamed.
          project="$(basename "$PWD" | tr '[:upper:] ' '[:lower:]-')-e2e"
          docker compose -f compose.e2e.yml -p "$project" logs --tail 100 || true

  # Template only: the same suite for a project cut with each block combination
  # (scripts/check_preset.py). Nightly and on demand, not per PR: every preset
  # builds its own stack.
  detect:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.b.outputs.template }}
    steps:
      - uses: actions/checkout@v5
      - id: b
        run: python3 scripts/blocks.py env --github | tee -a "$GITHUB_OUTPUT"

  presets:
    name: "e2e preset: ${{ matrix.preset }}"
    needs: detect
    if: >-
      needs.detect.outputs.template == 'true' && (
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [site, web-api, api, worker, bot]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Init the project and run its suite
        run: python3 scripts/check_preset.py ${{ matrix.preset }} --e2e
