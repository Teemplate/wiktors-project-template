name: CI

# Runs on GitHub's hosted runners, so a broken commit is caught before it ever
# reaches the Pi. These are the cheap checks that would otherwise only fail at
# deploy time, when the site is already down.
on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # matches backend/Dockerfile's base image
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Check the serving modules import cleanly
        # An import-time error (a bad name, a missing stdlib import) is
        # otherwise only discovered when the container starts in production.
        working-directory: backend
        run: python -c "import app.main"

      - name: Tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22        # matches frontend/Dockerfile's base image
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Typecheck
        # `npm run lint` is deliberately not run here for Next.js projects —
        # `next lint` prompts interactively and will hang a CI runner.
        run: npm run typecheck
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend

      - name: Build
        # The image build does this too, but on the Pi — failing here takes
        # seconds instead of tying up the Pi for minutes.
        run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate every compose file
        # Interpolation is checked too, so a typo'd ${VAR} fails here rather
        # than producing an empty value in production.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml   config --quiet
          docker compose -f compose.deploy.yml   config --quiet
          # compose.e2e.yml reads .env.e2e, which scripts/e2e.sh writes at run
          # time. A minimal stand-in is enough to validate the file's shape.
          printf 'E2E_PROJECT=ci\nE2E_WEB_PORT=5273\nE2E_API_PORT=8273\n' > .env.e2e
          docker compose -f compose.e2e.yml --env-file .env.e2e config --quiet

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-not-a-secret@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      # THE MOST VALUABLE CHECK FOR PARALLEL AGENTS. Two feature branches that
      # each autogenerate a revision produce sibling heads, and
      # `alembic upgrade head` then fails on the Pi at deploy time — with the
      # site already down — instead of failing here in seconds.
      - name: Exactly one migration head
        working-directory: backend
        run: |
          heads=$(alembic heads | grep -c . || true)
          echo "heads found: $heads"
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::$heads migration heads. Re-point the newer revision's down_revision at the other."
            exit 1
          fi

      - name: Migrations apply to an empty database
        working-directory: backend
        run: alembic upgrade head

      - name: The seed runs against the migrated schema
        # Catches the common drift where a model gains a column, the migration
        # is written, and the seed is never updated to match.
        working-directory: backend
        run: python -m app.seed

      - name: And roll back again
        working-directory: backend
        run: alembic downgrade base

  migration-safety:
    name: destructive migration guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Look for destructive operations in new revisions
        env:
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'destructive-ok') }}
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- backend/migrations/versions/ || true)
          if [ -z "$changed" ]; then
            echo "No migration changes in this PR."
            exit 0
          fi
          echo "Changed revisions:"; echo "$changed"
          python3 scripts/check_migration_safety.py $changed

  images:
    name: both images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Built on x86 here purely to prove the Dockerfiles are valid. The real
      # arm64 images are built natively on the Pi at deploy time.
      - name: Build backend image
        run: docker build -t app-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t app-frontend:ci --target prod ./frontend

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Scans the working tree rather than history: the point is to stop a key
      # going in, and a hit in old history would pin CI red until a rewrite.
      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose

      # local/ holds real hostnames, LAN addresses and server paths. It is
      # gitignored, but a gitignore only helps until someone runs `git add -f`
      # or rewrites .gitignore. THIS REPOSITORY IS PUBLIC, so the cost of that
      # mistake is publishing a private network layout -- worth a hard gate
      # rather than trusting the ignore file alone.
      - name: No local/ files tracked
        run: |
          tracked="$(git ls-files -- local/ || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Files under local/ are tracked. That directory is" \
                 "gitignored on purpose and this repository is public."
            echo "$tracked" | sed 's/^/  /'
            echo
            echo "Untrack them, keeping the files on disk:"
            echo "  git rm -r --cached local/ && git commit -m 'chore: untrack local/'"
            echo "If any real value was already pushed, treat it as disclosed:"
            echo "rotate what can be rotated and rewrite the history."
            exit 1
          fi
          echo "nothing under local/ is tracked"

      # The ignore rule itself. `local` is written WITHOUT a trailing slash on
      # purpose: `local/` matches only a real directory, so a SYMLINK named
      # local -- which is exactly what DEVELOPING.md tells you to create in a
      # worktree -- would show up as untracked and go in with `git add -A`.
      # This step fails on that regression instead of letting it publish a
      # private network layout months later.
      - name: local/ is actually ignored
        run: |
          fail=0

          # 1. a real directory, with something nested inside it
          mkdir -p local/nested && echo canary > local/nested/canary.md
          if [ -n "$(git status --porcelain -- local)" ]; then
            echo "::error::local/ is not ignored as a directory."
            git status --porcelain -- local; fail=1
          fi
          rm -rf local

          # 2. local as a SYMLINK -- the case a trailing slash misses
          mkdir -p "$RUNNER_TEMP/local-canary" && ln -s "$RUNNER_TEMP/local-canary" local
          if [ -n "$(git status --porcelain -- local)" ]; then
            echo "::error::a symlink named local is NOT ignored. The .gitignore" \
                 "rule must be 'local', with no trailing slash."
            git status --porcelain -- local; fail=1
          fi
          rm -f local

          [ "$fail" = 0 ] || exit 1
          echo "local/ is ignored as both a directory and a symlink"
