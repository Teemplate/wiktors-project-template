name: Agent context

# Only when agent context or a document it links to changes: running on every
# push to every branch cost a hosted Actions minute each time for nothing.
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/*.md'
      - '.agent-context.json'
      - 'scripts/check_agent_context.py'
      - '.github/workflows/agent-context.yml'
      - '.claude/**'
      - '.codex/**'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/*.md'
      - '.agent-context.json'
      - 'scripts/check_agent_context.py'
      - '.github/workflows/agent-context.yml'
      - '.claude/**'
      - '.codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate portable agent instructions
        run: python3 scripts/check_agent_context.py
      - name: Exercise agent-context regression cases
        run: python3 scripts/tests/test_agent_context.py
